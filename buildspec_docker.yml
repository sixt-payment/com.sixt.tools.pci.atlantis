version: 0.2

phases:
  pre_build:
    commands:
      #- echo "Logging in to Sixt-Payment Docker Registry"
      # docker login -u push $DOCKER_REGISTRY_URL -p $REGISTRY_PUSH_PASSWORD
      - export IMAGE_TAG=$(cat git_hash)
      #- export IMAGE="$DOCKER_REGISTRY_URL/$SERVICE_NAME:$IMAGE_TAG"
      - export ECR_IMAGE="$ECR_URL:$IMAGE_TAG"
      - export ECR_IMAGE_CLAIR="$ECR_URL:latest"
  build:
    commands:
      - echo "Listing directory contents"
      - $(aws ecr get-login --no-include-email --region ${AWS_REGION})
      - echo $(pwd) && ls -lah **
      - chmod +x docker-entrypoint.sh
      - echo "Building the Docker image..."          
      - docker build -t $SERVICE_NAME .
      #- docker tag $SERVICE_NAME:latest $IMAGE
      - docker tag $SERVICE_NAME:latest  $ECR_IMAGE
      - docker tag $SERVICE_NAME:latest  $ECR_IMAGE_CLAIR
      
      # Wiz scan (visibility, NOT a gate here): every CVE is listed; the gate + AI fix happen in Find-Fixes / Approve-Fixes
      - |
        if [ -n "${WIZ_CLIENT_ID:-}" ] && [ -n "${WIZ_CLIENT_SECRET:-}" ]; then
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64 -o wizcli && chmod +x wizcli \
            && ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET" >/dev/null \
            && ./wizcli scan container-image "$ECR_IMAGE" --policy PCI-Critical-Fixable,PCI-SENSITIVE-DATA-POLICY,PCI-SECRETS-POLICY,PCI-HIGH-VUL --by-policy-hits=DISABLED --no-color=false --json-output-file=wiz-output.json \
            || echo "WIZ: policy failed or scan error - not blocking Dockerize; Find-Fixes attempts the AI fix and Approve-Fixes is the gate"
        else
          echo "WIZ: credentials not injected - scan skipped"
        fi
  post_build:
    commands:
      #- 'echo "{\"image\": \"$IMAGE\"}" > deploy.json'
      - 'echo "{\"image\": \"$ECR_IMAGE\"}" > deploy.json'
      - echo Build completed on `date +'%s'`
      - echo "Pushing the Docker image..."
      #- docker push $IMAGE
      - $(aws ecr get-login --no-include-email --region ${AWS_REGION})
      - docker push  $ECR_IMAGE
      - docker push  $ECR_IMAGE_CLAIR
artifacts:
  files:
    - deploy.json
    - wiz-output.json
